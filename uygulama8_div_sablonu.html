<!DOCTYPE html>
<html>
    <head>
        <title>Div ile HTML Web sayfası şablonu</title>
        <style>
            #Header{
                
                width: 900px;
                border: 1px dotted darkblue;
                height: 60px;
                background-color: orange;
                text-align: center;
                line-height: 60px;
            }
            #Nav{
                width: 200px;
                border: 1px dotted darkblue;
                height: 200px;
                background-color: purple;
                text-align: center;
                float: left;
            }
            #Section{
                width: 500px;
                border: 1px dotted darkblue;
                height: 200px;
                background-color: rgb(201, 120, 201);
                text-align: center;
                float: left;
            }
             #Aside{
                width: 200px;
                border: 1px dotted darkblue;
                height: 200px;
                background-color: rgb(0, 47, 255);
                text-align: center;
                float: left;
            }
            #Footer{
                width: 900px;
                border:1px dotted darkblue;
                height: 40px;
                background-color: gray;
                text-align: center;
                clear: left;
            }
              #sheader{
                width: 90%;
                border: 1px dotted rgb(0, 255, 115);
                height: 40px;
                background-color: orange;
                text-align: center;
                line-height: 40px;
                margin: auto auto;
            }
              #article{
                width: 90%;
                border: 1px dotted rgb(0, 255, 115);
                height: 40px;
                background-color: tomato;
                text-align: center;
                line-height: 40px;
                margin: 20px auto;
            }
              #sFooter{
                width: 90%;
                border: 1px dotted rgb(0, 255, 115);
                height: 40px;
                background-color: gray;
                text-align: center;
                line-height: 40px;
                margin: auto auto;
            }
            
        
        
            
        </style>
    </head>
    <body>
    <div id="Header" >HEADER</div>
    <div id="Nav" >NAV</div>
    <div id="Section">Section
        <div id="sheader"> Header </div>
        <div id="article"> article </div>
        <div id="sFooter"> Footer </div>

        
   </div>

    <div id="Aside" >Aside</div>
    <div id="Footer">Footer</div>
    </body>
</html>
